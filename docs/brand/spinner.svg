<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Loading">
  <title>Loading</title>
  <defs>
    <mask id="cog-hole" maskUnits="userSpaceOnUse" x="-20" y="-20" width="40" height="40">
      <rect x="-20" y="-20" width="40" height="40" fill="#fff"/>
      <ellipse cx="0.5" cy="-0.3" rx="3.3" ry="2.9" transform="rotate(-25)" fill="#000"/>
    </mask>
  </defs>
  <!-- outer group = fixed 3D tilt; inner group = spin in the cog's own plane -->
  <g transform="translate(16 16) rotate(90) scale(1.07) rotate(-18) scale(1.08 0.74) rotate(18)">
    <g fill="#F6821D" mask="url(#cog-hole)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <g transform="rotate(12)">
        <ellipse rx="8.3" ry="7.7" transform="rotate(20)"/>
        <rect x="-3.2" y="-11.2" width="6.4" height="6" rx="2" transform="rotate(0) rotate(-6 0 -9)"/>
        <rect x="-2.8" y="-10.6" width="5.6" height="5.4" rx="1.8" transform="rotate(58) rotate(8 0 -9)"/>
        <rect x="-3.1" y="-11.6" width="6.2" height="6.4" rx="2.2" transform="rotate(122) rotate(-4 0 -9)"/>
        <rect x="-2.9" y="-10.8" width="5.8" height="5.6" rx="1.6" transform="rotate(178) rotate(10 0 -9)"/>
        <rect x="-3.3" y="-11.4" width="6.6" height="6.2" rx="2.3" transform="rotate(243) rotate(-9 0 -9)"/>
        <rect x="-2.7" y="-11.2" width="5.4" height="6" rx="1.9" transform="rotate(301) rotate(5 0 -9)"/>
      </g>
    </g>
  </g>
</svg>
