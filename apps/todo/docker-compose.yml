# Optional Docker runtime for the todo API (not a replacement for `cogs launch`).
# From repo root: docker compose -f apps/todo/docker-compose.yml up --build
# Includes MinIO for large blob tests (bypass app 12MiB default when COGS_MAX_UPLOAD_BYTES set).

services:
  minio:
    image: minio/minio:latest
    pull_policy: if_not_present
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cogsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cogsminio-dev-change-me}
    volumes:
      - minio-data:/data
    # S3 API is on the compose network only (todo-api → minio:9000). Publish for debugging:
    # ports:
    #   - "${MINIO_PORT:-19000}:9000"
    #   - "${MINIO_CONSOLE_PORT:-19001}:9001"
  minio-init:
    image: minio/mc:latest
    pull_policy: if_not_present
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cogsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cogsminio-dev-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-cogs-todo-blobs}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sleep 4
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$MINIO_BUCKET" || true

  todo-api:
    build:
      context: ../..
      dockerfile: apps/todo/Dockerfile
    image: cogs-todo:local
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${COGS_HOST_PORT:-18787}:18787"
    env_file:
      - path: .env.docker
        required: false
    environment:
      COGS_LISTEN: 0.0.0.0:18787
      COGS_ALLOW_PUBLIC_BIND: "1"
      COGS_DB_PATH: /data/todo.db
      COGS_BLOB_STORE: minio
      COGS_S3_ENDPOINT: http://minio:9000
      COGS_S3_BUCKET: ${MINIO_BUCKET:-cogs-todo-blobs}
      COGS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cogsminio}
      COGS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cogsminio-dev-change-me}
      COGS_S3_PATH_STYLE: "true"
      COGS_MAX_UPLOAD_BYTES: ${COGS_MAX_UPLOAD_BYTES:-104857600}
      COGS_OBS: ${COGS_OBS:-off}
      COGS_SESSION_SECRET: ${COGS_SESSION_SECRET:-docker-dev-change-me}
      COGS_PUBLIC_PAGE_ORIGIN: ${COGS_PUBLIC_PAGE_ORIGIN:-http://127.0.0.1:8788}
      COGS_PUBLIC_API_URL: ${COGS_PUBLIC_API_URL:-http://127.0.0.1:18787}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18787/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  minio-data:
