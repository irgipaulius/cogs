name = "cogs-worker-client"
main = "src/index.js"
compatibility_date = "2026-10-20"

# Replace SERVICE_ID after: wrangler vpc service create ...
[[vpc_services]]
binding = "COGS_ORIGIN"
service_id = "YOUR_SERVICE_ID"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "cogs-edge"
database_id = "YOUR_D1_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cogs-data"
